name: PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.sql"
      - "**.sqlx"
      - "models/**"
      - "specs/**"
      - "*.tf"
      - "**schema.yml"
      - "**sources.yml"

# All jobs are read-only. Nothing in this workflow writes to the repo,
# deploys infrastructure, or modifies the warehouse.
permissions:
  contents: read
  pull-requests: write

jobs:

  # ─────────────────────────────────────────────────────────────────
  # CHECK 1: SQL Formatting (SQLFluff)
  # Fails the PR if any changed SQL file has lint violations.
  # ─────────────────────────────────────────────────────────────────
  formatting:
    name: SQL Formatting (SQLFluff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Get changed SQL files
        id: changed
        run: |
          BASE_SHA=$(git merge-base HEAD origin/main)
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- '*.sql' '*.sqlx' | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run SQLFluff lint on changed files
        if: steps.changed.outputs.files != ''
        run: |
          echo "Linting: ${{ steps.changed.outputs.files }}"
          sqlfluff lint ${{ steps.changed.outputs.files }} --format github-annotation
        # Exit code 1 = violations found → job fails → PR blocked

      - name: No SQL files changed
        if: steps.changed.outputs.files == ''
        run: echo "No SQL files changed in this PR. Formatting check skipped."

  # ─────────────────────────────────────────────────────────────────
  # CHECK 2: Schema Breaker
  # Detects if any schema change in this PR breaks downstream
  # datasets in the DAG. Read-only: connects to dbt manifest or
  # Dataform compilation output. No warehouse writes.
  # ─────────────────────────────────────────────────────────────────
  schema-breaker:
    name: Schema Breaker (DAG impact)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml networkx

      - name: Run schema breaker check
        run: python scripts/check_schema_breaking.py
        env:
          BASE_REF: origin/main
          # Provide the path to the compiled DAG manifest.
          # For dbt: target/manifest.json (generated by dbt compile in CI)
          # For Dataform: .dataform/compiledGraph.json
          MANIFEST_PATH: ${{ vars.DAG_MANIFEST_PATH || 'target/manifest.json' }}

  # ─────────────────────────────────────────────────────────────────
  # CHECK 3: AI PR Review (GitHub Copilot — native)
  # Copilot reviews the PR automatically using the rules defined in
  # .github/copilot-code-review-instructions.md.
  # No API key or custom script required — configured in repo settings.
  # See docs/capability-library/pr-validation.md → Check 3 for setup.
  # ─────────────────────────────────────────────────────────────────
  # This job is intentionally absent from the workflow file.
  # Copilot review is triggered by GitHub itself when a PR is opened
  # or updated — it does not run as a workflow job.
  # Branch protection should require the "Copilot code review" check
  # to pass if you want it to block merge.
